name: Bug report
description: Something in tailbond doesn't work as expected
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If you're a maintainer and tick the box at the bottom, an AI agent looks at this issue as soon as it's opened: it links a **draft PR** if it finds a fix, or comments with questions if it can't. Anyone else: a maintainer may add the `autofix` label after reading the issue.
        Remove secrets (pairing links, keys, public IPs you don't want shared) from logs before pasting.
  - type: dropdown
    id: component
    attributes:
      label: Where does it happen?
      options:
        - GL.iNet / OpenWrt router (travel client)
        - GL.iNet / OpenWrt router (home server)
        - Fedora home server (RPM)
        - VPS / Linux install.sh
        - Mac
        - Android app
        - iPhone Share app
        - Pair & Share
        - Web dashboard / Get tailbond page
        - Tailscale integration
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "After pairing the Slate 7, the panel shows Disconnected; I expected Connected with two WANs."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tailbond version
      description: Shown at the bottom of the dashboard/panel, in the app's settings, or by `tailbondd -version`.
      placeholder: "0.1.0-r42 / commit abc1234"
  - type: input
    id: device
    attributes:
      label: Device and firmware / OS
      placeholder: "GL-BE9300 Flint 3, GL 4.10.1 · Pixel 8, Android 15 · macOS 26 (M3)"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Router `logread -e tailbond`, `journalctl -u tailbond`, the dashboard's Logs tab, or Android logcat filtered to `tailbond`.
      render: text
  - type: checkboxes
    id: autofix
    attributes:
      label: Automation
      options:
        - label: Let an AI agent attempt a fix PR for this issue (maintainers' issues only; otherwise a maintainer decides)
          required: false
