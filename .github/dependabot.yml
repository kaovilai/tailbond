version: 2

# One PR for everything: every ecosystem's version updates land in the
# single "all-dependencies" multi-ecosystem group, once a week. Security
# updates are grouped per ecosystem (multi-ecosystem groups only cover
# version updates), so an urgent fix still arrives on its own day.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York

updates:
  - package-ecosystem: gomod
    directory: /agent
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    groups:
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    # Never scan the compiled gh-aw files: their `uses:` pins are owned by
    # .github/aw/actions-lock.json (gh-aw-actions) and the pinned gh-aw
    # compiler (actions/checkout & friends in the scaffolding). Dependabot
    # editing compiled output is stale by construction -- the lock check
    # recompiles and reverts it, so the PR can only be red (PR #58). The
    # upgrade path for these pins is `gh aw upgrade` + recompile, not
    # dependabot. Hand-written workflows still get their bumps.
    exclude-paths:
      - .github/workflows/*.lock.yml
      - .github/workflows/agentics-maintenance.yml
    multi-ecosystem-group: all-dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # The server image's base (deploy/docker/Dockerfile, pinned by digest)
  - package-ecosystem: docker
    directory: /deploy/docker
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  # mqvpn (data plane) is NOT auto-bumped: it sits under vendored patches
  # (patches/mqvpn/*.patch), and a pointer bump rejects them -- the build
  # refuses an unpatched mqvpn by design, so the PR can only be red (PR
  # #58: 0001-client-control-api.patch, 1 of 14 hunks). Bump it by hand
  # with the patch rebased and the e2e green. A future submodule without
  # vendored patches can drop the ignore. Note: ignore, not exclude-paths
  # -- the git-submodule fetcher parses .gitmodules directly and never
  # consults the path exclusions; a submodule's dependency name is its
  # path (dependabot-core git_submodules/file_parser.rb: name = path).
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    ignore:
      - dependency-name: "third_party/mqvpn"
    multi-ecosystem-group: all-dependencies

  # Add once ios/ is on main (the iPhone share app's Swift package):
  # - package-ecosystem: swift
  #   directory: /ios/TailbondShareKit
  #   patterns: ["*"]
  #   multi-ecosystem-group: all-dependencies
