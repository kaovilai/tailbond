name: Dependabot auto-merge

# Simple dependency updates merge themselves once CI is green, then a release
# is cut so every install picks them up. "Simple" = no major-version bump in
# the PR (grouped PRs: none of the updates is a major). Majors wait for a human.
#
# Stage 1 (pull_request_target, Dependabot PRs only): read Dependabot's
# metadata and label the PR "automerge" if it qualifies. Nothing from the PR
# is checked out or run here.
# Stage 2 (workflow_run of CI): when CI succeeds on a labelled Dependabot PR,
# merge it and dispatch the auto-release workflow. Merges made with
# GITHUB_TOKEN don't trigger push workflows, so the release is dispatched
# explicitly (workflow_dispatch is allowed from GITHUB_TOKEN).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  label:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Label simple updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Check every commit, not just the first: each one must be Dependabot's,
        # and every dependency it lists must be a semver patch or minor update.
        # A major, an unclassified entry (git submodule SHA bumps carry no
        # update-type) or any other author keeps the PR for a human.
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/commits" > commits.json
          if python3 - commits.json <<'EOF'
          import json, re, sys
          commits = json.load(open(sys.argv[1]))
          ok, why = True, []
          for c in commits:
              author = (c.get("author") or {}).get("login", "")
              if author != "dependabot[bot]":
                  ok = False; why.append("commit %s by %s" % (c["sha"][:7], author or "unknown"))
                  continue
              msg = c["commit"]["message"]
              block = msg.split("updated-dependencies:", 1)
              if len(block) < 2:
                  ok = False; why.append("commit %s has no dependency metadata" % c["sha"][:7]); continue
              entries = re.split(r"^- dependency-name:", block[1].split("\n...", 1)[0], flags=re.M)[1:]
              if not entries:
                  ok = False; why.append("commit %s lists no dependencies" % c["sha"][:7])
              for e in entries:
                  name = e.splitlines()[0].strip()
                  m = re.search(r"update-type:\s*(\S+)", e)
                  kind = m.group(1) if m else "unknown"
                  print("%s: %s" % (name, kind))
                  if kind not in ("version-update:semver-patch", "version-update:semver-minor"):
                      ok = False; why.append("%s is %s" % (name, kind))
          print("\n".join(why))
          sys.exit(0 if ok and commits else 1)
          EOF
          then
            gh pr edit "$PR" -R "$REPO" --add-label automerge
          else
            gh pr edit "$PR" -R "$REPO" --remove-label automerge 2>/dev/null || true
            echo "Not auto-merging (see above)"
          fi

  merge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the PR if it is labelled and still at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,headRefOid,labels,author \
                 --jq '.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]")')
          [ -n "$pr" ] || { echo "No open Dependabot PR for $BRANCH"; exit 0; }
          num=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          labelled=$(jq -r '[.labels[].name] | index("automerge") != null' <<<"$pr")
          if [ "$labelled" != true ]; then echo "PR #$num isn't labelled automerge"; exit 0; fi
          if [ "$head" != "$SHA" ]; then echo "PR #$num moved on since CI ran ($SHA -> $head)"; exit 0; fi
          gh pr merge "$num" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          gh workflow run auto-release.yml -R "$REPO" --ref main -f reason="Dependabot PR #$num"
