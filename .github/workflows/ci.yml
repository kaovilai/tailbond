name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TB_JOBS: 4
  JOBS: 4
  # Compiled into every tailbondd (scripts/release/ldflags.sh): the
  # repository whose GitHub releases the update check reads (docs/updates.md).
  TB_UPDATE_REPO: ${{ github.repository }}
  # The release version on v* tags (the build scripts drop the v); empty
  # otherwise, so they use git describe (dev builds never self-update).
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  # Docs-only changes skip the heavy jobs below: a README edit shouldn't spend
  # 30 jobs, a macOS runner and a full mqvpn build. A skipped job reports as
  # successful, so the required checks still pass. A tag always builds — a
  # release needs its artifacts — and so does anything touching code, the site,
  # workflows or packaging.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.which.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs-only?
        id: which
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          code=true
          case "$REF" in
            refs/tags/*) ;;                 # a tag always builds: a release needs its artifacts
            *)
              if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
                files=""
                if [ -n "${BASE//0/}" ]; then  # an all-zero "before" is a new branch
                  files=$(git diff --no-renames --name-only "$BASE...$HEAD" 2>/dev/null || echo CODE)
                else
                  files=$(git diff --no-renames --name-only "$HEAD^" "$HEAD" 2>/dev/null || echo CODE)
                fi
                # docs: anything under docs/, or markdown/text anywhere in the
                # tree (a README next to its code is still a text change).
                # CMakeLists.txt is a build input despite the .txt name.
                # A per-file loop, not a grep pipeline: grep -q exits early,
                # printf takes SIGPIPE under pipefail, and the inverted
                # failure would read a code change as docs-only.
                if [ -n "$files" ]; then
                  code=false
                  while IFS= read -r f; do
                    case "$f" in
                    *CMakeLists.txt) code=true; break ;;
                    ""|docs/*|*.md|*.txt|LICENSE|NOTICE|*/LICENSE|*/NOTICE) ;;
                    *) code=true; break ;;
                    esac
                  done <<< "$files"
                fi
              fi
              ;;
          esac
          echo "docs-only: $code=false means the heavy jobs are skipped"
          echo "code=$code" >> "$GITHUB_OUTPUT"


  agent:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Agent (Go tests + builds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Brand tokens in sync, contrast (docs/brand.md)
        run: |
          python3 scripts/brand/gen-tokens.py --check
          python3 scripts/brand/contrast.py
      - name: go vet
        working-directory: agent
        run: go vet ./...
      - name: go test -race
        working-directory: agent
        run: go test -race ./...
      - name: OpenWrt bypass hook on real OpenWrt userland (podman)
        run: scripts/test-openwrt-bypass-hook.sh
      - name: Build linux/amd64 + linux/arm64
        run: agent/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: tailbondd
          path: out/agent/
          if-no-files-found: error
      # the stand-in sharer for the Android emulator's Pair & Share hub test
      - name: tb-sharesim (linux/amd64)
        working-directory: agent
        run: CGO_ENABLED=0 go build -trimpath -o ../out/tools/tb-sharesim ./cmd/tb-sharesim
      - uses: actions/upload-artifact@v7
        with:
          name: tb-sharesim-linux-amd64
          path: out/tools/tb-sharesim
          if-no-files-found: error

  shellcheck:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: ShellCheck
    runs-on: ubuntu-24.04
    env:
      # shell=busybox (the OpenWrt scripts) needs 0.10+; Ubuntu 24.04 ships 0.9
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          f="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$f"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/$f"
          echo "SHELLCHECK=$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" >>"$GITHUB_ENV"
      - name: ShellCheck (scripts, hooks; OpenWrt files as busybox sh)
        run: scripts/shellcheck.sh
      - name: Release gate covers every job
        run: python3 scripts/ci/check-release-needs.py
      # release files live on GitHub Releases only, never in git
      - name: No build outputs or files over 1 MB in git
        run: scripts/ci/check-tracked-files.sh
      - name: Brand SVGs draw (beam gradient in user space, web copies match)
        run: scripts/brand/check-svgs.sh
      - name: Release asset names (stable latest/download names, SHA256SUMS, signed opkg feed)
        run: scripts/release/test-collect-assets.sh
      - name: macOS installer helpers (port holders, subnet overlap) on canned output
        run: scripts/test-macos-install-helpers.sh
      - name: hadolint (the server image's Dockerfile)
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSLo "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" deploy/docker/Dockerfile

  e2e:
    name: End-to-end (netns, patched mqvpn)
    runs-on: ubuntu-24.04
    needs: [changes, agent]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install build + test deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake build-essential libevent-dev iproute2 curl netcat-openbsd openssl dnsmasq-base nftables bind9-dnsutils jq python3
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      # The binaries are cached, not the build tree: a fresh checkout gives
      # every source a new mtime, so a restored tree rebuilt from scratch
      # anyway. Same inputs (pinned mqvpn, patches, build scripts, week)
      # give the same binary, so a hit skips the build.
      - name: Cache patched mqvpn (binary, its 0005 unit tests)
        id: mqbin
        uses: actions/cache@v6
        with:
          path: |
            out/native/mqvpn
            out/build/mqvpn-native/src/build/tests/test_cert_pin
            out/build/mqvpn-native/src/build/tests/test_config_bridge
          key: mqvpn-native-bin-${{ steps.mq.outputs.os }}-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-native.sh', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Build patched mqvpn
        if: steps.mqbin.outputs.cache-hit != 'true'
        run: scripts/build-mqvpn-native.sh
      - name: mqvpn certificate pin unit tests (patches/mqvpn/0005)
        run: |
          out/build/mqvpn-native/src/build/tests/test_cert_pin
          out/build/mqvpn-native/src/build/tests/test_config_bridge
      - name: Client control API smoke test
        run: sudo scripts/smoke-client-control.sh
      - name: e2e-cert-pin (an impostor server with another certificate is refused)
        run: MQVPN="$PWD/out/native/mqvpn" scripts/e2e-cert-pin.sh
      - name: e2e-netns
        run: MQVPN="$PWD/out/native/mqvpn" scripts/e2e-netns.sh
      - name: e2e-backup (backup, wipe, restore, the client reconnects)
        run: MQVPN="$PWD/out/native/mqvpn" scripts/e2e-backup.sh
      - name: e2e-share (Pair & Share - a sharer's relay path bonded by a hub)
        run: MQVPN="$PWD/out/native/mqvpn" scripts/e2e-share.sh
      - name: Server memory and CPU under load (informational)
        continue-on-error: true
        run: MB=100 MQVPN="$PWD/out/native/mqvpn" TAILBONDD="$PWD/out/agent/linux-amd64/tailbondd" scripts/measure-server-mem.sh

  android:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Android APK
    runs-on: ubuntu-24.04
    outputs:
      # "true" when the signed release APK was built (artifact android-release-apk)
      release-apk: ${{ steps.release-apk.outputs.built }}
    env:
      # Release signing (docs/updates.md, "Android signing key"): secrets
      # from scripts/release/gen-android-keystore.sh. Without them only the
      # debug APK is built, and a release tag fails in job "release".
      TB_HAS_RELEASE_KEY: ${{ secrets.TB_RELEASE_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK, NDK, CMake
        run: android/scripts/setup-sdk.sh
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      - name: Cache native libs
        uses: actions/cache@v6
        with:
          # build-native.sh skips the NDK build when these prebuilt libs exist
          # (arm64-v8a for phones, x86_64 for the emulator)
          # (from the patched copy of mqvpn, scripts/lib/mqvpn-src.sh)
          path: out/mqvpn-android/src/android/sdk-native/prebuilt
          key: android-native-${{ steps.mq.outputs.sha }}-${{ hashFiles('android/scripts/build-native.sh', 'android/scripts/setup-sdk.sh', 'patches/mqvpn/*.patch', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Unit tests, lint, debug APK
        run: android/scripts/build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/android/tailbond-debug.apk
          if-no-files-found: error
      # x86_64-only debug APK for the emulator (job android-e2e); phones get arm64 only
      # Report a problem (docs/reporting.md): screen renders for review
      - name: Report a problem screens (Robolectric renders)
        run: android/scripts/gradle.sh :app:testDebugUnitTest --tests 'dev.tailbond.app.ux.ReportScreens' -Ptailbond.uxOut="$PWD/out/ux/report/android"
      - uses: actions/upload-artifact@v7
        with:
          name: report-screens-android
          path: out/ux/report/android/
          if-no-files-found: error
      # Android TV (docs/android.md, "Android TV"): the key screens at 1080p, with the D-pad focus
      - name: Android TV screens (Robolectric renders)
        run: android/scripts/gradle.sh :app:testDebugUnitTest --tests 'dev.tailbond.app.ux.TvScreens' -Ptailbond.uxOut="$PWD/out/ux/tv/android"
      - uses: actions/upload-artifact@v7
        with:
          name: tv-screens-android
          path: out/ux/tv/android/
          if-no-files-found: error
      - name: x86_64 debug APK (emulator e2e)
        run: android/scripts/build-e2e-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-x86_64
          path: out/android/tailbond-debug-x86_64.apk
          if-no-files-found: error
      - name: Release APK (signed with the release key)
        id: release-apk
        if: env.TB_HAS_RELEASE_KEY == 'true' && hashFiles('android/scripts/build-release-apk.sh') != ''
        env:
          TB_RELEASE_KEYSTORE_B64: ${{ secrets.TB_RELEASE_KEYSTORE_B64 }}
          TB_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TB_RELEASE_KEYSTORE_PASSWORD }}
          TB_RELEASE_KEY_ALIAS: ${{ secrets.TB_RELEASE_KEY_ALIAS }}
          TB_RELEASE_KEY_PASSWORD: ${{ secrets.TB_RELEASE_KEY_PASSWORD }}
        run: |
          export TB_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$TB_RELEASE_KEYSTORE"' EXIT
          (umask 077; printf '%s' "$TB_RELEASE_KEYSTORE_B64" | base64 -d >"$TB_RELEASE_KEYSTORE")
          android/scripts/build-release-apk.sh
          echo "built=true" >>"$GITHUB_OUTPUT"
      # The key never changes by accident: a phone refuses an update signed
      # with another key (variable from gen-android-keystore.sh).
      - name: Release APK is signed with the known key
        if: env.TB_HAS_RELEASE_KEY == 'true' && vars.TB_RELEASE_CERT_SHA256 != ''
        env:
          WANT: ${{ vars.TB_RELEASE_CERT_SHA256 }}
        run: |
          signers=("$ANDROID_HOME"/build-tools/*/apksigner)
          signer="$(printf '%s\n' "${signers[@]}" | sort -V | tail -n1)"
          # Release APKs only: the debug builds (tailbond-debug*.apk, incl.
          # the x86_64 emulator one) are signed with the debug key on purpose.
          checked=0
          for apk in out/android/tailbond-*.apk; do
            case "$apk" in out/android/tailbond-debug*.apk) continue ;; esac
            got="$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
            echo "$apk: $got"
            if [ "${got,,}" != "${WANT,,}" ]; then
              echo "::error::$apk is signed with $got, not the release key $WANT (TB_RELEASE_CERT_SHA256). A new key makes every user reinstall: restore the old key with scripts/release/gen-android-keystore.sh --restore."
              exit 1
            fi
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no release APK in out/android to check"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: env.TB_HAS_RELEASE_KEY == 'true' && hashFiles('android/scripts/build-release-apk.sh') != ''
        with:
          name: android-release-apk
          path: |
            out/android/tailbond-*.apk
            !out/android/tailbond-debug*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports/

  # The phone path end to end: the x86_64 debug APK on an Android emulator
  # (KVM), paired through the tailbond://pair deep link with a tailbond
  # server on the runner (10.0.2.2 from the emulator), checked over adb
  # (scripts/e2e-android.sh).
  android-e2e:
    name: Android emulator end-to-end
    runs-on: ubuntu-24.04
    needs: [changes, agent, android, mqvpn-x86_64]
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tailbondd
          path: out/agent/
      - uses: actions/download-artifact@v8
        with:
          name: mqvpn-x86_64
          path: out/x86_64/
      - uses: actions/download-artifact@v8
        with:
          name: android-apk-x86_64
          path: out/android/
      - uses: actions/download-artifact@v8
        with:
          name: tb-sharesim-linux-amd64
          path: out/tools/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: tailbond server on the runner (static mqvpn, Tailscale off)
        run: |
          chmod +x out/x86_64/mqvpn out/agent/linux-amd64/tailbondd out/tools/tb-sharesim
          MQVPN="$PWD/out/x86_64/mqvpn" TAILBONDD="$PWD/out/agent/linux-amd64/tailbondd" SHARESIM="$PWD/out/tools/tb-sharesim" scripts/e2e-android-server.sh
      - name: Emulator (API 34, x86_64) and the checks
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # one line: the action runs each script line as its own shell
          script: scripts/e2e-android.sh
      - name: Server log
        if: always()
        run: |
          sudo cat /tmp/tailbond-e2e-android/server.log | tail -n 80 || true
          scripts/e2e-android-server.sh stop || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-e2e
          path: out/e2e-android/
          if-no-files-found: warn

  # Android TV (docs/android.md, "Android TV"): the same x86_64 debug APK on
  # an Android TV emulator, found through the TV launcher and driven with the
  # remote's keys only (scripts/e2e-android-tv.sh). No server: the screens,
  # focus and dialogs, not the tunnel (job android-e2e covers that).
  android-tv:
    name: Android TV emulator (remote only)
    runs-on: ubuntu-24.04
    needs: [changes, android]
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-apk-x86_64
          path: out/android/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android TV emulator (API 36, x86_64, 1080p) and the checks
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: scripts/e2e-android-tv.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-tv
          path: out/e2e-android-tv/
          if-no-files-found: warn

  # The macOS client (hub) role (docs/macos.md): patched mqvpn built natively
  # on arm64 with mqvpn's own Darwin unit tests, tailbondd's Go tests on
  # darwin, and the hub end to end on the runner (scripts/e2e-macos.sh).
  # The e2e server for job macos: an aarch64 Linux VM image (kernel +
  # initramfs) with the static mqvpn and tailbondd in the server role
  # (scripts/e2e-macos/build-server-vm.sh). Native arm64: no qemu-user.
  macos-e2e-server:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: macOS e2e server VM image (Linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install podman, cpio
        run: |
          if ! command -v podman || ! command -v cpio; then
            sudo apt-get update -q && sudo apt-get install -y -q podman cpio
          fi
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      # The binaries are cached, not the build tree: a fresh checkout gives
      # every source a new mtime, so a restored tree rebuilt from scratch
      # anyway. Same inputs (pinned mqvpn, patches, build scripts, week)
      # give the same binary, so a hit skips the build.
      # same key in jobs mqvpn-aarch64, openwrt and macos-e2e-server
      - name: Cache static aarch64 mqvpn
        id: mqbin
        uses: actions/cache@v6
        with:
          path: out/aarch64/mqvpn
          key: mqvpn-aarch64-bin-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-aarch64-musl.sh', 'scripts/build-mqvpn-musl.sh', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Static aarch64 mqvpn
        if: steps.mqbin.outputs.cache-hit != 'true'
        run: scripts/build-mqvpn-aarch64-musl.sh
      - name: tailbondd linux/arm64
        run: agent/build.sh arm64
      - name: Server VM image
        run: scripts/e2e-macos/build-server-vm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-e2e-server
          path: out/e2e-vm/
          if-no-files-found: error

  macos:
    name: macOS client (mqvpn, tailbondd, e2e)
    runs-on: macos-latest
    needs: [changes, macos-e2e-server]
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Homebrew deps (libevent, GNU patch, rsvg-convert for the app icon)
        run: brew install libevent gpatch librsvg
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      # The binaries are cached, not the build tree: a fresh checkout gives
      # every source a new mtime, so a restored tree rebuilt from scratch
      # anyway. Same inputs (pinned mqvpn, patches, build scripts, week)
      # give the same binary, so a hit skips the build.
      # The key also names the macOS release and Homebrew's libevent (linked
      # statically). A hit skips mqvpn's Darwin unit tests too: they ran when
      # this binary was built.
      - name: Homebrew libevent version
        id: libevent
        run: echo "v=$(brew list --versions libevent | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache patched mqvpn
        id: mqbin
        uses: actions/cache@v6
        with:
          path: out/macos/mqvpn
          key: mqvpn-macos-bin-${{ runner.arch }}-${{ steps.mq.outputs.os }}-${{ steps.libevent.outputs.v }}-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-macos.sh', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Build patched mqvpn and run its Darwin unit tests
        if: steps.mqbin.outputs.cache-hit != 'true'
        run: TB_TEST=1 scripts/build-mqvpn-macos.sh
      - name: go vet + go test (darwin)
        working-directory: agent
        run: |
          go vet ./...
          go test ./...
      - name: Build tailbondd (darwin/arm64) and the test sharer
        run: |
          agent/build.sh darwin/arm64
          (cd agent && CGO_ENABLED=0 go build -trimpath -o ../out/agent/darwin-arm64/tb-sharesim ./cmd/tb-sharesim)
          (cd agent && CGO_ENABLED=0 go build -trimpath -o ../out/agent/darwin-arm64/tb-dnsstub ./cmd/tb-dnsstub)
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            out/macos/mqvpn
            out/agent/darwin-arm64/tailbondd
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        with:
          name: macos-e2e-server
          path: out/e2e-vm/
      - name: QEMU (the e2e server VM), wireguard-go (a second VPN's utun)
        run: brew install qemu wireguard-go
      # the real NetBird package, for a logged-out smoke test (no account)
      - name: NetBird (not logged in)
        run: brew install netbirdio/tap/netbird || echo "::warning::brew install netbirdio/tap/netbird failed; the e2e notes it"
      - name: e2e-macos (hub on this Mac, 2 phone shares, server in a VM)
        run: scripts/e2e-macos.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-macos-logs
          path: out/e2e-macos/
          if-no-files-found: ignore
      # the menu bar app (macos/TailbondMenu): unit tests, the menu window
      # rendered for each state (artifact menubar-screens), tailbond.app;
      # TB_E2E_STATUS: the status e2e-macos saved after "Connect via phone"
      - name: Menu bar app (tests, screens, ad-hoc signed tailbond.app)
        run: |
          TB_SNAPSHOT_DIR="$PWD/out/ux/menubar" TB_E2E_STATUS="$PWD/out/e2e-macos/phone-connect-status.json" swift test --package-path macos/TailbondMenu
          ls out/ux/menubar/*.png
          packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: menubar-screens
          path: out/ux/menubar/
          if-no-files-found: error
      - name: macOS bundle and Homebrew formula
        run: |
          TB_REQUIRE_APP=1 packaging/macos/build-bundle.sh
          tar -tzf out/macos/tailbond-macos-arm64.tar.gz | grep -qx 'tailbond-macos-arm64/tailbond.app/Contents/MacOS/tailbond'
          tar -tzf out/macos/tailbond-macos-arm64.tar.gz | grep -qx 'tailbond-macos-arm64/icons/tailbond.icns'
      - name: Install test (install.sh, --update, uninstall.sh, Homebrew formula)
        run: |
          /bin/bash scripts/test-macos-install-helpers.sh   # macOS's own bash 3.2
          scripts/test-macos-install.sh out/macos/tailbond-macos-arm64.tar.gz out/macos/tailbond.rb
      # The dashboard's "Update now" end to end, the way a Mac gets it: a
      # fake GitHub release on 127.0.0.1, the agent's download + SHA-256
      # check, the new bundle's install.sh --update detached from the
      # LaunchDaemon (it restarts the daemon from under it), the rollback of
      # a release that doesn't start, install.sh --update alone, and a
      # refused bad SHA256SUMS (scripts/e2e-macos-update.sh).
      - name: Update e2e (fake GitHub release, Update now, rollback, install.sh --update, SHA256SUMS)
        run: scripts/e2e-macos-update.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: |
            out/macos/tailbond-macos-arm64.tar.gz
            out/macos/tailbond.rb
          if-no-files-found: error

  # The Mac as home server (docs/macos.md "Mac as home server"): job macos's
  # mqvpn (server mode on a utun, patch 0006) and tailbondd on this runner
  # with the macOS hooks, a Linux client bonding two paths in the QEMU VM
  # from job macos-e2e-server, a stand-in Tailscale (scripts/e2e-macos-server.sh).
  macos-server:
    name: macOS server (e2e, Linux client in a VM)
    runs-on: macos-latest
    needs: [changes, macos, macos-e2e-server]
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: out/
      - uses: actions/download-artifact@v8
        with:
          name: macos-e2e-server
          path: out/e2e-vm/
      - name: QEMU (the client VM)
        run: brew install qemu
      - name: e2e-macos-server (server on this Mac, Linux client in a VM)
        run: |
          chmod 0755 out/macos/mqvpn out/agent/darwin-arm64/tailbondd
          scripts/e2e-macos-server.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-macos-server-logs
          path: out/e2e-macos-server/
          if-no-files-found: ignore

  # tailbond Share for iPhone (ios/, docs/ios.md): the relay core's unit
  # tests on macOS and on an iOS simulator, and an unsigned simulator build
  # of the app. No signing, no App Store.
  ios:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: iOS tailbond Share (simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (relay framing, auth, pairing; macOS)
        working-directory: ios/TailbondShareKit
        run: swift test
      - name: Generate the Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Unit tests on an iOS simulator
        shell: bash
        run: |
          set -o pipefail
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')"
          echo "simulator $udid"
          cd ios && xcodebuild test -project TailbondShare.xcodeproj -scheme TailbondShare -destination "id=$udid" CODE_SIGNING_ALLOWED=NO | tail -n 60
      - name: Build the app (iOS simulator, unsigned)
        shell: bash
        run: |
          set -o pipefail
          cd ios && xcodebuild build -project TailbondShare.xcodeproj -scheme TailbondShare -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -n 30

  openwrt:
    name: GL.iNet / OpenWrt ipk
    # Native arm64 runner: static musl mqvpn builds in an arm64 Alpine
    # container and the OpenWrt install test runs without qemu.
    runs-on: ubuntu-24.04-arm
    needs: [changes, android]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install podman
        run: command -v podman || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: out/android/
      # The signed release APK, when built: the app a home server offers
      # must be the one phones update to (debug and release can't update
      # each other).
      - uses: actions/download-artifact@v8
        if: needs.android.outputs.release-apk == 'true'
        with:
          name: android-release-apk
          path: out/android-release/
      - name: Use the release APK when there is one
        run: |
          for f in out/android-release/tailbond-*.apk; do
            if [ -f "$f" ]; then echo "TAILBOND_APK=$PWD/$f" >>"$GITHUB_ENV"; fi
          done
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      # The binaries are cached, not the build tree: a fresh checkout gives
      # every source a new mtime, so a restored tree rebuilt from scratch
      # anyway. Same inputs (pinned mqvpn, patches, build scripts, week)
      # give the same binary, so a hit skips the build.
      # same key in jobs mqvpn-aarch64, openwrt and macos-e2e-server
      - name: Cache static aarch64 mqvpn
        id: mqbin
        uses: actions/cache@v6
        with:
          path: out/aarch64/mqvpn
          key: mqvpn-aarch64-bin-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-aarch64-musl.sh', 'scripts/build-mqvpn-musl.sh', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Static aarch64 mqvpn
        if: steps.mqbin.outputs.cache-hit != 'true'
        run: scripts/build-mqvpn-aarch64-musl.sh
      - name: Build ipk
        env:
          # tailbond_<version>-r1_<arch>.ipk on v* tags (else 0.1.0-r<n>)
          TB_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}-r1', github.ref_name) || '' }}
        run: packaging/openwrt/build-ipk.sh
      - name: Install test in OpenWrt 23.05 arm64 (and the signed opkg feed)
        env:
          # rootful: the container needs the OpenWrt feed (lua, uhttpd)
          PODMAN: sudo podman
        run: scripts/test-openwrt-ipk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glinet-ipk
          path: out/ipk/*.ipk
          if-no-files-found: error

  # Report a problem (docs/reporting.md) in a browser against a real
  # tailbondd: the dashboard and the GL.iNet panel; redaction, the
  # checkbox gate, the issue URL, the file and the clipboard.
  # Then the accessibility check (docs/accessibility.md): axe-core on the
  # site, the phone page, the dashboard, the GL panel and the LuCI view;
  # fails on serious or critical. Same job (a required check), same
  # Chromium image; the job's name stays so the required check keeps matching.
  report-ux:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Report a problem (dashboard + GL panel, Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Flow check and screenshots (Playwright in podman)
        run: scripts/ux/report-screens.sh "$PWD/out/ux/report/web"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-screens-web
          path: out/ux/report/web/
          if-no-files-found: ignore
      - name: Accessibility (axe-core, every web surface; Playwright in podman)
        if: ${{ !cancelled() }}
        run: scripts/ux/a11y.sh "$PWD/out/ux/a11y"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: a11y-report
          path: out/ux/a11y/
          if-no-files-found: ignore

  mqvpn-x86_64:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Static x86_64 mqvpn (musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      # The binaries are cached, not the build tree: a fresh checkout gives
      # every source a new mtime, so a restored tree rebuilt from scratch
      # anyway. Same inputs (pinned mqvpn, patches, build scripts, week)
      # give the same binary, so a hit skips the build.
      - name: Cache static x86_64 mqvpn
        id: mqbin
        uses: actions/cache@v6
        with:
          path: out/x86_64/mqvpn
          key: mqvpn-x86_64-bin-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-musl.sh', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Build (native amd64 Alpine, podman)
        if: steps.mqbin.outputs.cache-hit != 'true'
        run: scripts/build-mqvpn-musl.sh x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: mqvpn-x86_64
          path: out/x86_64/mqvpn
          if-no-files-found: error

  # The aarch64 Linux bundle's mqvpn (a VPS or Linux laptop on arm64);
  # native arm64 runner, same cache as job "openwrt".
  mqvpn-aarch64:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Static aarch64 mqvpn (musl)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install podman
        run: command -v podman || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
      - name: mqvpn submodule revision
        id: mq
        # sha: the pinned mqvpn. week: a fresh build at least weekly, for the
        # distro and Homebrew packages it links. os: the runner's OS release
        # (ubuntu24, macos26), for builds that link the runner's own libraries;
        # not the image build, which differs between runners during a rollout.
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"
      # The binaries are cached, not the build tree: a fresh checkout gives
      # every source a new mtime, so a restored tree rebuilt from scratch
      # anyway. Same inputs (pinned mqvpn, patches, build scripts, week)
      # give the same binary, so a hit skips the build.
      # same key in jobs mqvpn-aarch64, openwrt and macos-e2e-server
      - name: Cache static aarch64 mqvpn
        id: mqbin
        uses: actions/cache@v6
        with:
          path: out/aarch64/mqvpn
          key: mqvpn-aarch64-bin-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-aarch64-musl.sh', 'scripts/build-mqvpn-musl.sh', 'scripts/lib/*.sh') }}-${{ steps.mq.outputs.week }}
      - name: Build (native arm64 Alpine, podman)
        if: steps.mqbin.outputs.cache-hit != 'true'
        run: scripts/build-mqvpn-aarch64-musl.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mqvpn-aarch64
          path: out/aarch64/mqvpn
          if-no-files-found: error

  linux-bundle:
    name: Generic Linux bundle (VPS)
    runs-on: ubuntu-24.04
    needs: [changes, agent, mqvpn-x86_64, mqvpn-aarch64]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # mqvpn's LICENSE and NOTICE
      - uses: actions/download-artifact@v8
        with:
          name: tailbondd
          path: out/agent/
      - uses: actions/download-artifact@v8
        with:
          name: mqvpn-x86_64
          path: out/x86_64/
      - uses: actions/download-artifact@v8
        with:
          name: mqvpn-aarch64
          path: out/aarch64/
      # release assets tailbond-linux-x86_64.tar.gz and -aarch64.tar.gz
      - name: Build bundles
        run: |
          chmod +x out/x86_64/mqvpn out/aarch64/mqvpn out/agent/linux-*/tailbondd
          TB_ARCHS="x86_64 aarch64" packaging/linux/build-bundle.sh
          test -s out/linux/tailbond-linux-x86_64.tar.gz
          tar -tzf out/linux/tailbond-linux-aarch64.tar.gz | grep -qx 'tailbond-linux-aarch64/bin/mqvpn'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: out/linux/*.tar.gz
          if-no-files-found: error

  vps-install:
    name: VPS install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [changes, linux-bundle]
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        image: ["almalinux:10", "debian:12", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle
          path: out/linux/
      - name: install.sh in ${{ matrix.image }} (dry-run decisions, install, re-run, run, uninstall)
        env:
          IMAGE: docker.io/library/${{ matrix.image }}
        run: |
          sudo podman run --rm --cap-add NET_ADMIN --device /dev/net/tun -v "$PWD:/src:ro" "$IMAGE" \
            bash /src/packaging/linux/test-install.sh /src/out/linux/tailbond-linux-x86_64.tar.gz
      - name: systemd unit (almalinux/10-init)
        if: matrix.image == 'almalinux:10'
        run: |
          sudo podman run -d --name tb --systemd=always --cap-add NET_ADMIN --device /dev/net/tun \
            -v "$PWD:/src:ro" docker.io/almalinux/10-init
          sudo podman exec tb bash -euc '
            for _ in $(seq 1 30); do systemctl is-system-running -q --wait 2>/dev/null && break; sleep 1; done
            dnf install -y -q iproute nftables tar gzip >/dev/null
            mkdir -p /tmp/b && tar -C /tmp/b -xzf /src/out/linux/tailbond-linux-x86_64.tar.gz
            /tmp/b/tailbond-linux-x86_64/install.sh --no-tailscale --public-addr 203.0.113.7
            systemctl is-active tailbond
            # the dashboard'"'"'s "Update now" path: install.sh --update in its own
            # transient unit (systemd-run), which restarts tailbond and checks it
            systemd-run --unit tailbond-update-ci --collect --wait --quiet -- \
              /tmp/b/tailbond-linux-x86_64/install.sh --update --force --bundle-dir /tmp/b/tailbond-linux-x86_64
            grep -q "\"result\":\"ok\"" /var/lib/tailbond/update-result.json
            systemctl is-active tailbond
            test -x /usr/local/bin/tailbondd.prev
            systemctl show tailbond -p MemoryHigh -p MemoryMax -p OOMScoreAdjust
            systemctl show tailbond -p MemoryMax | grep -qx MemoryMax=167772160
            nft list table inet tailbond | grep -q masquerade
            /tmp/b/tailbond-linux-x86_64/uninstall.sh --purge
            ! systemctl is-active -q tailbond'
          sudo podman rm -f tb
      - uses: actions/setup-go@v7
        if: matrix.image == 'almalinux:10'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Updates (fake GitHub release, Update now, rollback, install.sh --update, SHA256SUMS)
        if: matrix.image == 'almalinux:10'
        run: |
          sudo -E env "PATH=$PATH" scripts/e2e-update-vps.sh out/linux/tailbond-linux-x86_64.tar.gz docker.io/library/almalinux:10

  # The server image (deploy/docker, docs/deploy.md), built per architecture
  # on a native runner from the Linux bundles above (the same tailbondd and
  # static mqvpn), then tested: a client bonding 2 paths through the
  # published UDP port, NAT, the dashboard, state across a new container on
  # the same volume (scripts/e2e-oci.sh), and compose.yaml in podman and
  # docker compose. Job "release" pushes these exact images.
  oci-image:
    name: Server image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [changes, linux-bundle]
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, bundle: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, bundle: aarch64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: localhost/tailbond:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-bundle
          path: out/linux/
      - name: Install podman, podman-compose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman podman-compose iproute2 jq
      - name: Build the image (podman, --format docker)
        run: PODMAN="sudo podman" deploy/docker/build-image.sh ${{ matrix.arch }}
      - name: Image metadata (arch, labels, HEALTHCHECK, binaries)
        run: |
          sudo podman image inspect "$IMAGE" | jq '.[0] | {Architecture, Labels, Healthcheck: (.Config.Healthcheck // .Healthcheck)}' | tee "$RUNNER_TEMP/meta.json"
          jq -e --arg a "${{ matrix.arch }}" '.Architecture == $a
            and .Labels["org.opencontainers.image.source"] == "https://github.com/kaovilai/tailbond"
            and (.Labels["org.opencontainers.image.version"] | length > 0)
            and .Healthcheck.Test == ["CMD", "/usr/local/bin/tailbond-healthcheck"]' "$RUNNER_TEMP/meta.json"
          sudo podman run --rm --entrypoint /opt/tailbond/bin/tailbondd "$IMAGE" -version
          sudo podman image ls "$IMAGE"
      - name: e2e-oci (podman; a client bonds 2 paths; NAT, dashboard, restart on the same volume)
        run: scripts/e2e-oci.sh "$IMAGE" out/linux/tailbond-linux-${{ matrix.bundle }}.tar.gz
      - name: compose.yaml (podman compose, docker compose)
        env:
          PODMAN_COMPOSE_PROVIDER: podman-compose
          TB_REQUIRE_COMPOSE: "1"
        run: scripts/test-compose.sh "$IMAGE"
      - name: Save the image
        run: |
          mkdir -p out/oci
          sudo podman save --format docker-archive -o out/oci/tailbond-${{ matrix.arch }}.tar "$IMAGE"
          sudo chown "$(id -u)" out/oci/tailbond-${{ matrix.arch }}.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-image-${{ matrix.arch }}
          path: out/oci/tailbond-${{ matrix.arch }}.tar
          if-no-files-found: error

  # deploy/kubernetes: kubeconform on both kustomizations, then the amd64
  # image in kind (Docker, the runner's engine; host UDP 443 -> NodePort ->
  # the Service, as a load balancer would) with the same client e2e. The
  # Tailscale sidecar overlay is only validated, not run (it needs a tailnet).
  kubernetes:
    name: Kubernetes (kubeconform, kind e2e)
    runs-on: ubuntu-24.04
    needs: [changes, linux-bundle, oci-image]
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-bundle
          path: out/linux/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-image-amd64
          path: out/oci/
      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}, kind ${{ env.KIND_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/kc.tgz" "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kc.tgz" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/kc.tgz" kubeconform
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: kubeconform (base, tailscale overlay)
        run: |
          set -o pipefail # a kustomize error fails the step
          for k in base tailscale; do
            kubectl kustomize "deploy/kubernetes/$k" | kubeconform -strict -summary -
          done
      - name: kind cluster, the image loaded
        run: |
          kind create cluster --config scripts/ci/kind-config.yaml --wait 120s
          kind load image-archive out/oci/tailbond-amd64.tar --name tailbond
      - name: e2e-oci (kind; a client outside the cluster bonds 2 paths through the Service)
        env:
          TB_OCI_BACKEND: kind
        run: KUBECONFIG="$HOME/.kube/config" scripts/e2e-oci.sh localhost/tailbond:ci out/linux/tailbond-linux-x86_64.tar.gz
      - name: Cluster state
        if: failure()
        run: |
          kubectl get all,pvc,events -n tailbond -o wide || true
          kubectl -n tailbond describe pod || true

  ansible:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Ansible role lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ansible-lint
        run: |
          pipx install ansible-core
          pipx inject ansible-core ansible-lint --include-apps
          ansible-galaxy collection install ansible.posix community.general
          cd packaging/ansible && ansible-lint roles/tailbond

  rpm:
    name: Fedora RPM
    runs-on: ubuntu-24.04
    needs: [changes, android]
    if: ${{ needs.changes.outputs.code == 'true' }}
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Build deps
        run: |
          dnf install -y -q git cmake gcc gcc-c++ make perl libevent-devel golang rpm-build \
            systemd-rpm-macros findutils file which
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: out/android/
      - uses: actions/download-artifact@v8
        if: needs.android.outputs.release-apk == 'true'
        with:
          name: android-release-apk
          path: out/android-release/
      - name: Use the release APK when there is one
        run: |
          for f in out/android-release/tailbond-*.apk; do
            if [ -f "$f" ]; then echo "TAILBOND_APK=$PWD/$f" >>"$GITHUB_ENV"; fi
          done
      # build-rpm.sh skips building mqvpn when these two exist (see the
      # mqvpn caches above for why the binaries, not the build tree)
      - name: mqvpn submodule revision, Fedora release
        id: mq
        run: |
          {
            echo "sha=$(git rev-parse HEAD:third_party/mqvpn)"
            echo "week=$(date -u +%G-W%V)"
            echo "os=$(. /etc/os-release && echo "$ID$VERSION_ID")"
          } >> "$GITHUB_OUTPUT"
      - name: Cache mqvpn (built by build-rpm.sh)
        uses: actions/cache@v6
        with:
          path: |
            third_party/mqvpn/build/mqvpn
            third_party/mqvpn/build/mqvpn-nat-config
          key: rpm-mqvpn-${{ steps.mq.outputs.os }}-${{ steps.mq.outputs.sha }}-${{ hashFiles('packaging/fedora/build-rpm.sh') }}-${{ steps.mq.outputs.week }}
      - name: Build RPM
        run: packaging/fedora/build-rpm.sh
      - name: Install and remove test
        run: |
          dnf install -y -q out/rpm/tailbond-server-*.rpm
          test -x /usr/bin/mqvpn && test -x /usr/bin/tailbondd
          test -f /usr/share/tailbond/tailbond.apk
          rpm -q --scripts tailbond-server
          # rpm -e, not dnf remove: dnf also removes the dependencies it
          # pulled in, and ipset's own %preun fails in a container. Our
          # %preun/%postun must run clean: any scriptlet message fails.
          out="$(rpm -e tailbond-server 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          if grep -Ei 'scriptlet|warning|error' <<<"$out"; then exit 1; fi
          test ! -e /usr/bin/tailbondd
      - uses: actions/upload-artifact@v7
        with:
          name: fedora-rpm
          path: out/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Release
    if: ${{ needs.changes.outputs.code == 'true' && (startsWith(github.ref, 'refs/tags/v')) }}
    needs: [changes, agent, shellcheck, e2e, android, android-e2e, android-tv, ios, ansible, report-ux, mqvpn-x86_64, mqvpn-aarch64, openwrt, rpm, linux-bundle, vps-install, oci-image, kubernetes, macos-e2e-server, macos, macos-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # the server image: ghcr.io/<owner>/tailbond (docs/deploy.md)
      packages: write
      # build provenance (actions/attest-build-provenance): no keys
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          # the commits since the previous release (security marker below)
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist/
      # The images job oci-image built and tested (amd64 + arm64), as one
      # multi-arch tag vX.Y.Z before the release exists; X.Y and latest
      # move only after it does (job image-tags), so `latest` is always a release.
      - name: Push the server image (vX.Y.Z)
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for a in amd64 arm64; do
            podman load -i "dist/oci-image-$a/tailbond-$a.tar"
            podman tag localhost/tailbond:ci "localhost/tailbond:$a"
          done
          podman manifest create localhost/tailbond:release containers-storage:localhost/tailbond:amd64 containers-storage:localhost/tailbond:arm64
          podman manifest inspect localhost/tailbond:release | jq -e '[.manifests[].platform.architecture] | sort == ["amd64", "arm64"]'
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # the attestation below (push-to-registry) reads only Docker's
          # ~/.docker/config.json, which docker login writes natively
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # v2s2: Docker media types keep HEALTHCHECK in the image config
          podman manifest push --all --format v2s2 --digestfile "$RUNNER_TEMP/digest" localhost/tailbond:release "docker://$repo:$TAG"
          echo "name=$repo" >>"$GITHUB_OUTPUT"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >>"$GITHUB_OUTPUT"
      # gh attestation verify oci://ghcr.io/<owner>/tailbond:vX.Y.Z -R <owner>/tailbond
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # stable names (releases/latest/download/<name>) plus the versioned
      # ipk/rpm, and SHA256SUMS: scripts/release/collect-assets.sh. With
      # secret TB_OPKG_SIGNING_KEY (scripts/release/gen-opkg-key.sh) also the
      # signed opkg feed (Packages, Packages.gz, Packages.sig); without it a
      # warning and no feed.
      - name: Collect assets, opkg feed and SHA256SUMS
        env:
          TB_OPKG_SIGNING_KEY: ${{ secrets.TB_OPKG_SIGNING_KEY }}
        # not "assets/": the repo has one (logos), which would end up in the release
        run: scripts/release/collect-assets.sh dist release-assets
      # Anyone can check a file: gh attestation verify FILE -R OWNER/REPO.
      # tailbond itself checks SHA256SUMS over HTTPS (docs/updates.md).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          # v1.2.3-beta.1: a pre-release, which the update check never offers
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          # A security release: a "Security: yes" trailer on any commit since
          # the previous release. "[security]" in the notes makes "Right away"
          # installs skip their wait for a quiet moment (docs/updates.md); a
          # maintainer can also add it by editing the notes later.
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          notes=()
          if git log --format=%B "${prev:+$prev..}$TAG" | grep -qiE '^Security: *(yes|true) *$'; then
            notes=(--notes "[security] This release fixes a security issue. Installs on Right away take it without waiting for a quiet moment.")
            echo "security release (a Security: yes trailer since ${prev:-the start})"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes "${notes[@]}" --verify-tag "${pre[@]}" release-assets/*

  copr:
    name: COPR build (Fedora)
    if: ${{ needs.changes.outputs.code == 'true' && (startsWith(github.ref, 'refs/tags/v')) }}
    needs: [changes, release]
    runs-on: ubuntu-24.04
    env:
      # secret COPR_CONFIG: the ~/.config/copr file from
      # https://copr.fedorainfracloud.org/api/ (docs/fedora-server.md, COPR)
      HAS_COPR: ${{ secrets.COPR_CONFIG != '' }}
    steps:
      - name: No COPR_CONFIG secret
        if: env.HAS_COPR != 'true'
        run: 'echo "::notice::secret COPR_CONFIG is not set, so no COPR build (docs/fedora-server.md, COPR)"'
      - name: Start the COPR build of this tag
        if: env.HAS_COPR == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'tailbond' }}
          TAG: ${{ github.ref_name }}
        run: |
          pipx install copr-cli
          mkdir -p ~/.config
          (umask 077; printf '%s\n' "$COPR_CONFIG" >~/.config/copr)
          copr-cli buildscm --clone-url "https://github.com/$GITHUB_REPOSITORY" --commit "$TAG" \
            --method make_srpm --nowait "$COPR_PROJECT"

  # The release SBOM (docs/sbom.md): one SPDX document for every release
  # file, with what syft finds in it (tailbondd's Go modules), mqvpn and the
  # C libraries linked into it (scripts/sbom/mqvpn-components.json, versions
  # from the pinned submodules and the shipped binaries) and the APK's Maven
  # runtime dependencies (Gradle). Every run builds and checks it from this
  # run's artifacts; on a v* tag from the files "release" published, which
  # job sbom-publish then attaches and attests.
  sbom:
    name: SBOM (SPDX + CycloneDX, checked)
    needs: [changes, release, agent, android, openwrt, rpm, linux-bundle, macos]
    # "release" is skipped except on v* tags: run anyway, but not after a failure
    if: ${{ needs.changes.outputs.code == 'true' && (!cancelled() && !failure()) }}
    runs-on: ubuntu-24.04
    env:
      SYFT_VERSION: v1.56.0
      GRYPE_VERSION: v0.121.1
      SPDX_SCHEMA_URL: https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json
      SPDX_SCHEMA_SHA256: 239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # mqvpn's library versions come from the pinned submodules
          submodules: recursive
      - name: mqvpn's C libraries (versions from the submodules)
        run: python3 scripts/sbom/sbom.py components
      - name: sbom.py self-test (STATIC_LINK direction, SHA256SUMS, the APK inside the ipk)
        run: python3 scripts/sbom/test-sbom.py
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: bsdtar (unpacks the rpm), jsonschema, the SPDX 2.3 schema
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q jsonschema==4.26.0
          curl -fsSLo "$RUNNER_TEMP/spdx-schema.json" "$SPDX_SCHEMA_URL"
          echo "$SPDX_SCHEMA_SHA256  $RUNNER_TEMP/spdx-schema.json" | sha256sum -c -
      # The APK's Maven dependencies: releaseRuntimeClasspath, what the
      # release APK ships, as a Gradle dependency graph file.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK (as in job android)
        run: android/scripts/setup-sdk.sh
      - name: Android runtime dependencies (Gradle dependency graph)
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android
          # generate only (the upload is a side effect): job
          # dependency-snapshot submits it as part of the SBOM
          dependency-graph: generate-and-upload
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          dependency-graph-report-dir: out/gradle-graph
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true'
        with:
          name: tailbondd
          path: dist/tailbondd/
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true' && needs.android.outputs.release-apk == 'true'
        with:
          name: android-release-apk
          path: dist/android-release-apk/
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true' && needs.android.outputs.release-apk != 'true'
        with:
          name: android-apk
          path: dist/android-apk/
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true'
        with:
          name: glinet-ipk
          path: dist/glinet-ipk/
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true'
        with:
          name: fedora-rpm
          path: dist/fedora-rpm/
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true'
        with:
          name: linux-bundle
          path: dist/linux-bundle/
      - uses: actions/download-artifact@v8
        if: env.IS_TAG != 'true'
        with:
          name: macos-bundle
          path: dist/macos-bundle/
      - name: The release files (published ones on a tag, else this run's)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = true ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D release-assets
          else
            if [ ! -d dist/android-release-apk ]; then
              # no release key (a fork): the debug APK stands in, for this check only
              mkdir -p dist/android-release-apk
              cp dist/android-apk/tailbond-debug.apk dist/android-release-apk/tailbond-debug-stand-in.apk
              echo "::notice::no release APK in this run: the SBOM describes the debug APK"
            fi
            scripts/release/collect-assets.sh dist release-assets >/dev/null
          fi
          ls -l release-assets
      - name: SBOM (SPDX 2.3, CycloneDX 1.x)
        id: sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = true ]; then v="${TAG#v}"; tag="$TAG"; else v="dev-${GITHUB_SHA::12}"; tag=""; fi
          mkdir -p sbom
          spdx="sbom/tailbond-$v.spdx.json"
          python3 scripts/sbom/sbom.py build --assets release-assets --version "$v" ${tag:+--tag "$tag"} \
            --namespace "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/tailbond-$v.spdx.json" \
            --android-graph out/gradle-graph/*.json --out "$spdx"
          "$SYFT" convert "$spdx" -o "cyclonedx-json=sbom/tailbond-$v.cdx.json"
          echo "spdx=$spdx" >>"$GITHUB_OUTPUT"
      - name: Check (SPDX schema; every file and its SHA256; mqvpn's libraries with versions)
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/sbom/sbom.py check "${{ steps.sbom.outputs.spdx }}" \
            --assets release-assets --schema "$RUNNER_TEMP/spdx-schema.json" --require-android-deps --require-sums
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
      # Informational, never fails the run: grype also matches by CPE
      # (libevent, lwIP), which Dependabot can't.
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        continue-on-error: true
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
      - name: Known vulnerabilities (grype, informational)
        if: steps.grype.outcome == 'success'
        continue-on-error: true
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          SPDX: ${{ steps.sbom.outputs.spdx }}
        run: |
          "$GRYPE" "sbom:$SPDX" -o table >"$RUNNER_TEMP/grype.txt"
          { echo "### Known vulnerabilities (grype, informational)"; echo
            echo '```'; head -n 150 "$RUNNER_TEMP/grype.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # A tag's SBOM, attached to the release and attested: anyone can check it
  # with gh attestation verify FILE -R OWNER/REPO --predicate-type https://spdx.dev/Document
  sbom-publish:
    name: SBOM (attach to the release, attest)
    if: ${{ needs.changes.outputs.code == 'true' && (startsWith(github.ref, 'refs/tags/v')) }}
    needs: [changes, release, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/
      # The attestation's subjects come from SHA256SUMS: it must match the
      # published files, and list exactly the files the SBOM describes.
      - name: SHA256SUMS and the SBOM match the published files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D release-assets
          (cd release-assets && sha256sum --strict -c SHA256SUMS)
          spdx="$(ls sbom/*.spdx.json)"
          python3 scripts/sbom/sbom.py check "$spdx" --assets release-assets --require-android-deps --require-sums
          echo "spdx=$spdx" >>"$GITHUB_OUTPUT"
      # subjects: every file in SHA256SUMS, i.e. every release file
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
          sbom-path: ${{ steps.files.outputs.spdx }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber sbom/*.json

  # Dependabot alerts come from the default branch's dependency graph only,
  # and main's build is what a tag publishes (auto-release.yml tags main).
  # Submit what main's release files contain: the APK's Maven runtime
  # dependencies (in the graph from nowhere else), tailbondd's Go modules as
  # built, mqvpn's C libraries (GitHub has no advisories for those; grype
  # above and docs/sbom.md). On workflow_dispatch it submits for that ref,
  # which feeds dependency review only.
  dependency-snapshot:
    name: Dependency graph (submit the SBOM)
    if: ${{ needs.changes.outputs.code == 'true' && (!cancelled() && needs.sbom.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    needs: [changes, release, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/
      - name: Submit (dependency submission API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sbom/sbom.py snapshot sbom/*.spdx.json --sha "$GITHUB_SHA" --ref "$GITHUB_REF" >"$RUNNER_TEMP/snapshot.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json" \
            --jq '"snapshot \(.id): \(.result) \(.message)"'

  # The release exists: the server image's X.Y and latest tags point at the
  # vX.Y.Z that job release pushed (not for pre-releases).
  image-tags:
    name: Server image tags (X.Y, latest)
    if: ${{ needs.changes.outputs.code == 'true' && (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
    needs: [changes, release]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Tag ghcr.io/<owner>/tailbond X.Y and latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          minor="$(sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/' <<<"$TAG")"
          command -v skopeo || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for t in "$minor" latest; do
            skopeo copy --all --preserve-digests "docker://$repo:$TAG" "docker://$repo:$t"
          done
