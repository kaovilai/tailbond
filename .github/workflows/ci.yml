name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TB_JOBS: 4
  JOBS: 4

jobs:
  agent:
    name: Agent (Go tests + builds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: go vet
        working-directory: agent
        run: go vet ./...
      - name: go test -race
        working-directory: agent
        run: go test -race ./...
      - name: Build linux/amd64 + linux/arm64
        run: agent/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: tailbondd
          path: out/agent/
          if-no-files-found: error

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Scripts and Fedora hooks
        run: |
          mapfile -t files < <(git ls-files 'scripts/*.sh' 'scripts/**/*.sh' 'agent/*.sh' \
            'android/scripts/*.sh' 'packaging/fedora/*.sh' 'packaging/fedora/hooks/*' \
            'packaging/openwrt/*.sh')
          shellcheck -S warning "${files[@]}"
      - name: OpenWrt hooks and init (busybox sh)
        run: |
          mapfile -t files < <(git ls-files 'packaging/openwrt/hooks/*' 'packaging/openwrt/control/postinst' \
            'packaging/openwrt/control/prerm' 'packaging/openwrt/files/etc/init.d/*' \
            'packaging/openwrt/files/etc/uci-defaults/*' 'packaging/openwrt/files/usr/lib/tailbond/*')
          shellcheck -S warning --shell=busybox -x "${files[@]}"

  e2e:
    name: End-to-end (netns, patched mqvpn)
    runs-on: ubuntu-24.04
    needs: agent
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install build + test deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake build-essential libevent-dev iproute2 curl netcat-openbsd openssl
      - name: mqvpn submodule revision
        id: mq
        run: echo "sha=$(git rev-parse HEAD:third_party/mqvpn)" >> "$GITHUB_OUTPUT"
      - name: Cache mqvpn build tree
        uses: actions/cache@v6
        with:
          path: out/build/mqvpn-native
          key: mqvpn-native-${{ runner.os }}-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-native.sh', 'scripts/lib/*.sh') }}-${{ github.sha }}
          restore-keys: |
            mqvpn-native-${{ runner.os }}-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-native.sh', 'scripts/lib/*.sh') }}-
      - name: Build patched mqvpn
        run: scripts/build-mqvpn-native.sh
      - name: Client control API smoke test
        run: sudo scripts/smoke-client-control.sh
      - name: e2e-netns
        run: MQVPN="$PWD/out/native/mqvpn" scripts/e2e-netns.sh

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK, NDK, CMake
        run: android/scripts/setup-sdk.sh
      - name: mqvpn submodule revision
        id: mq
        run: echo "sha=$(git rev-parse HEAD:third_party/mqvpn)" >> "$GITHUB_OUTPUT"
      - name: Cache native libs
        uses: actions/cache@v6
        with:
          # build-native.sh skips the NDK build when these prebuilt libs exist
          path: third_party/mqvpn/android/sdk-native/prebuilt
          key: android-native-${{ steps.mq.outputs.sha }}-${{ hashFiles('android/scripts/build-native.sh') }}-${{ github.sha }}
          restore-keys: android-native-${{ steps.mq.outputs.sha }}-${{ hashFiles('android/scripts/build-native.sh') }}-
      - name: Unit tests, lint, debug APK
        run: android/scripts/build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: out/android/tailbond-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports/

  openwrt:
    name: GL.iNet / OpenWrt ipk
    # Native arm64 runner: static musl mqvpn builds in an arm64 Alpine
    # container and the OpenWrt install test runs without qemu.
    runs-on: ubuntu-24.04-arm
    needs: android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Install podman
        run: command -v podman || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: out/android/
      - name: mqvpn submodule revision
        id: mq
        run: echo "sha=$(git rev-parse HEAD:third_party/mqvpn)" >> "$GITHUB_OUTPUT"
      - name: Cache aarch64 mqvpn build tree
        uses: actions/cache@v6
        with:
          path: out/build/mqvpn-aarch64
          key: mqvpn-aarch64-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-aarch64-musl.sh', 'scripts/lib/*.sh') }}-${{ github.sha }}
          restore-keys: mqvpn-aarch64-${{ steps.mq.outputs.sha }}-${{ hashFiles('patches/mqvpn/*.patch', 'scripts/build-mqvpn-aarch64-musl.sh', 'scripts/lib/*.sh') }}-
      - name: Static aarch64 mqvpn
        run: scripts/build-mqvpn-aarch64-musl.sh
      - name: Build ipk
        run: packaging/openwrt/build-ipk.sh
      - name: Install test in OpenWrt 23.05 arm64
        run: scripts/test-openwrt-ipk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glinet-ipk
          path: out/ipk/*.ipk
          if-no-files-found: error

  rpm:
    name: Fedora RPM
    runs-on: ubuntu-24.04
    needs: android
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Build deps
        run: |
          dnf install -y -q git cmake gcc gcc-c++ make perl libevent-devel golang rpm-build \
            systemd-rpm-macros findutils file which
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: out/android/
      - name: Build RPM
        run: packaging/fedora/build-rpm.sh
      - name: Install and remove test
        run: |
          dnf install -y -q out/rpm/tailbond-server-*.rpm
          test -x /usr/bin/mqvpn && test -x /usr/bin/tailbondd
          test -f /usr/share/tailbond/tailbond.apk
          dnf remove -y -q tailbond-server
          test ! -e /usr/bin/tailbondd
      - uses: actions/upload-artifact@v7
        with:
          name: fedora-rpm
          path: out/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agent, shellcheck, e2e, android, openwrt, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
      - name: Checksums
        run: |
          find dist -type f \( -name '*.apk' -o -name '*.ipk' -o -name '*.rpm' -o -name tailbondd \) \
            -exec sha256sum {} + | sed 's|  dist/|  |' > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for d in dist/tailbondd/linux-*; do
            tar -czf "tailbondd-$TAG-$(basename "$d").tar.gz" -C "$d" tailbondd
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag \
            dist/android-apk/*.apk dist/glinet-ipk/*.ipk dist/fedora-rpm/*.rpm \
            tailbondd-*.tar.gz SHA256SUMS
