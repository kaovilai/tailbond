# tailbond server with Podman Compose or Docker Compose (docs/deploy.md).
# Put the settings in deploy/docker/.env (git-ignored) so every compose
# command sees them, then (rootful: UDP 443 and /dev/net/tun):
#   printf 'TAILBOND_PUBLIC_ADDR=vps.example.net\nTAILBOND_UI_PASSWORD=change-me\n' >.env
#   sudo podman compose up -d        (or: sudo docker compose up -d)
# Uses the published image; pin a release with TAILBOND_IMAGE=ghcr.io/kaovilai/tailbond:vX.Y.Z in .env.
# Build from source instead: build the Linux bundle, then
#   deploy/docker/build-image.sh, and TAILBOND_IMAGE=localhost/tailbond:dev in .env
# The image never updates itself: pull a new tag (`sudo podman compose pull && sudo podman compose up -d`).
services:
  tailbond:
    image: ${TAILBOND_IMAGE:-ghcr.io/kaovilai/tailbond:latest}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    # list form: podman-compose 1.0.x drops the values of the map form
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      TAILBOND_PUBLIC_ADDR: ${TAILBOND_PUBLIC_ADDR:?set TAILBOND_PUBLIC_ADDR}
      TAILBOND_PORT: ${TAILBOND_PORT:-443}
      TAILBOND_SUBNET: ${TAILBOND_SUBNET:-10.77.0.0/24}
      TAILBOND_MODE: ${TAILBOND_MODE:-speed}
      TAILBOND_UI_PASSWORD: ${TAILBOND_UI_PASSWORD:-}
      TAILBOND_UPDATE_POLICY: ${TAILBOND_UPDATE_POLICY:-notify}
    ports:
      - "${TAILBOND_PORT:-443}:${TAILBOND_PORT:-443}/udp"
      # Dashboard: keep it off the internet; reach it over SSH tunnel or a VPN.
      - "127.0.0.1:8077:8077/tcp"
    volumes:
      - tailbond-data:/data
    # A fixed address: the host's conntrack keeps sending a router's UDP flow
    # to the address the container had, so a replaced container must get it
    # again or that router can't reconnect while it keeps sending.
    networks:
      tailbond:
        ipv4_address: 10.89.77.2

networks:
  tailbond:
    ipam:
      config:
        - subnet: 10.89.77.0/24

volumes:
  tailbond-data:
