# The dashboard password. Empty: the dashboard listens on the pod's
# 127.0.0.1 only; reach it with
#   kubectl -n tailbond port-forward deploy/tailbond 8077:8077
# Set one (it then listens on the pod IP too, never exposed by service.yaml):
#   kubectl -n tailbond create secret generic tailbond-ui \
#     --from-literal=TAILBOND_UI_PASSWORD='<password>' --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: tailbond-ui
type: Opaque
stringData:
  TAILBOND_UI_PASSWORD: ""
