# tailbond server on Fly.io. UNTESTED TEMPLATE (see docs/deploy.md).
#
#   cd deploy/docker            # build context: the Dockerfile COPYs entrypoint.sh
#   fly launch --copy-config --no-deploy -c ../fly/fly.toml
#   fly ips allocate-v4            # dedicated IPv4: needed for UDP services
#   fly volumes create tailbond_data --size 1
#   fly secrets set TAILBOND_PUBLIC_ADDR=<the dedicated IPv4> TAILBOND_UI_PASSWORD=<pw>
#   fly deploy -c ../fly/fly.toml
#
# Known open question: Fly delivers UDP to the address "fly-global-services",
# not 0.0.0.0. mqvpn listens on 0.0.0.0, so this may need a listen-address
# option before it works. Check that first.
app = "tailbond-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TAILBOND_PORT = "443"

[[mounts]]
  source = "tailbond_data"
  destination = "/data"

[[services]]
  internal_port = 443
  protocol = "udp"

  [[services.ports]]
    port = 443

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
