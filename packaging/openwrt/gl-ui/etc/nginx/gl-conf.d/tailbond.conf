# tailbond: same-origin fallback for the GL admin panel view, used only if
# the "tailbond" /rpc object is unavailable (e.g. a firmware that restricts
# third-party RPC objects). Requires GL's admin session (Admin-Token cookie),
# checked through the same gl-session ubus object /rpc uses.
# The router package (home server role): GET /tailbond-glinet.ipk, same
# session check.
location = /tailbond-glinet.ipk {
    access_by_lua_block {
        local sid = (ngx.var.http_cookie or ""):match("Admin%-Token=([%w]+)")
        if not sid then return ngx.exit(401) end
        local ubus = require "oui.ubus"
        local s = ubus.call("gl-session", "session", { sid = sid })
        if not s or s.aclgroup ~= "root" then return ngx.exit(401) end
    }
    proxy_pass http://127.0.0.1:8077/tailbond-glinet.ipk;
    proxy_read_timeout 60s;
}

location ^~ /tailbond-api/ {
    access_by_lua_block {
        local sid = (ngx.var.http_cookie or ""):match("Admin%-Token=([%w]+)")
        if not sid then return ngx.exit(401) end
        local ubus = require "oui.ubus"
        local s = ubus.call("gl-session", "session", { sid = sid })
        if not s or s.aclgroup ~= "root" then return ngx.exit(401) end
        if ngx.req.get_method() ~= "GET" and not (ngx.var.http_content_type or ""):find("application/json", 1, true) then
            return ngx.exit(415)
        end
    }
    proxy_pass http://127.0.0.1:8077/api/;
    proxy_buffering off;
    proxy_read_timeout 30s;
    add_header X-Frame-Options DENY;
}
