# tailbond: same-origin proxy for the GL admin panel view. The panel uses it
# if the "tailbond" /rpc object is unavailable (e.g. a firmware that
# restricts third-party RPC objects), and always for what /rpc can't carry:
# files (backup download/restore, uploaded update files). Requires GL's admin
# session (Admin-Token cookie), checked through the same gl-session ubus
# object /rpc uses.
# The router package (home server role): GET /tailbond-glinet.ipk, same
# session check.
location = /tailbond-glinet.ipk {
    access_by_lua_block {
        local sid = (ngx.var.http_cookie or ""):match("Admin%-Token=([%w]+)")
        if not sid then return ngx.exit(401) end
        local ubus = require "oui.ubus"
        local s = ubus.call("gl-session", "session", { sid = sid })
        if not s or s.aclgroup ~= "root" then return ngx.exit(401) end
    }
    proxy_pass http://127.0.0.1:8077/tailbond-glinet.ipk;
    proxy_read_timeout 60s;
}

# Uploading update files into the home mirror (offline setups): the one
# call whose body isn't JSON. Same session check; POST with
# application/octet-stream only (not a CORS "simple" type, so another site
# can't send it with the admin's cookie), streamed to the agent.
location = /tailbond-api/update/upload {
    access_by_lua_block {
        local sid = (ngx.var.http_cookie or ""):match("Admin%-Token=([%w]+)")
        if not sid then return ngx.exit(401) end
        local ubus = require "oui.ubus"
        local s = ubus.call("gl-session", "session", { sid = sid })
        if not s or s.aclgroup ~= "root" then return ngx.exit(401) end
        if ngx.req.get_method() ~= "POST" then return ngx.exit(405) end
        if not (ngx.var.http_content_type or ""):find("application/octet-stream", 1, true) then
            return ngx.exit(415)
        end
    }
    client_max_body_size 200m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8077/api/update/upload$is_args$args;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Frame-Options DENY;
}

# Everything else under /api/ (JSON in; JSON or a file out, e.g. the
# encrypted backup from POST /api/backup or GET /api/backups/<name>).
# Restore bodies carry the backup as base64 (up to 2 MiB).
location ^~ /tailbond-api/ {
    access_by_lua_block {
        local sid = (ngx.var.http_cookie or ""):match("Admin%-Token=([%w]+)")
        if not sid then return ngx.exit(401) end
        local ubus = require "oui.ubus"
        local s = ubus.call("gl-session", "session", { sid = sid })
        if not s or s.aclgroup ~= "root" then return ngx.exit(401) end
        if ngx.req.get_method() ~= "GET" and not (ngx.var.http_content_type or ""):find("application/json", 1, true) then
            return ngx.exit(415)
        end
    }
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:8077/api/;
    proxy_buffering off;
    proxy_read_timeout 60s;
    add_header X-Frame-Options DENY;
}
