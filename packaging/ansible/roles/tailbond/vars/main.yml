---
# Internal: what the role writes into /etc/tailbond/tailbond.json.

# A new file starts from these (same as install.sh's fresh config).
_tailbond_conf_defaults:
  listen: ":8077"
  ui_password: ""
  mode: speed
  client:
    pairing_uri: ""
    paths: []

# semver MAJOR.MINOR.PATCH[-pre]; git describe builds (-N-g<hash>, -dirty)
# don't count as releases.
_tailbond_semver_re: '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$'

# Optional keys tailbondd omits when false/zero.
_tailbond_conf_omitempty:
  disable_tailscale: false
  landing_port: 0
  landing_public_port: 0
  server:
    disable_dns: false

# The update block the role owns: policy, plus pin/window/channel when set
# (tailbondd leaves empty values out, so empty ones aren't written).
_tailbond_update_owned: >-
  {{ {'policy': 'auto' if tailbond_update_policy == 'pinned' else tailbond_update_policy}
     | combine({'pin': tailbond_version | regex_replace('^v', '')} if tailbond_update_policy == 'pinned' else {})
     | combine({'window': tailbond_update_window} if tailbond_update_window | length > 0 else {})
     | combine({'channel': tailbond_update_channel} if tailbond_update_channel | length > 0 else {}) }}

# Owned by the role: set on every run, everything else is left alone
# (server.users, approvers, ui_password, mode, ...).
_tailbond_conf_owned: >-
  {{ {
       'role': 'server',
       'update': _tailbond_update_owned,
       'mqvpn_bin': tailbond_prefix ~ '/bin/mqvpn',
       'state_dir': '/var/lib/tailbond',
       'hooks_dir': tailbond_prefix ~ '/lib/tailbond/hooks',
       'disable_tailscale': not (tailbond_tailscale | bool),
       'landing_port': (tailbond_landing_port | int) if tailbond_tailscale | bool else -1,
       'landing_public_port': (tailbond_landing_public_port | int) if (tailbond_tailscale | bool and tailbond_landing_port | int != -1) else 0,
       'server': {
         'port': tailbond_port | int,
         'public_addr': tailbond_public_addr,
         'subnet': tailbond_subnet,
         'subnet6': _tailbond_subnet6,
         'use_tailscale_cert': tailbond_tailscale | bool,
         'disable_dns': tailbond_disable_dns | bool,
       },
     } | combine({'android_apk': tailbond_prefix ~ '/share/tailbond/tailbond.apk'} if _tailbond_apk.stat.exists | default(false) else {}) }}
